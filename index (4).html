<body>
<div id="shell"></div>

<noscript><p style="padding:24px;text-align:center">FREE FIRE LAB يحتاج إلى تفعيل JavaScript. | FREE FIRE LAB nécessite JavaScript.</p></noscript>
<script>
/* self-check: shows errors on screen instead of a blank page */
(function () {
  var box;
  function show(m) {
    if (!box) { box = document.createElement('pre'); box.style.cssText = 'position:fixed;z-index:9999;left:8px;right:8px;bottom:8px;max-height:70vh;overflow:auto;background:#3a0b0b;color:#fff;border:2px solid #ff6b6b;padding:12px;font:13px/1.5 monospace;white-space:pre-wrap;direction:ltr;text-align:left;border-radius:10px'; document.body.appendChild(box); }
    box.textContent += m + '\n';
  }
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t.tagName && t.tagName !== 'SCRIPT') return;
    show('ERROR: ' + (e.message || 'a script file failed to load') + ' ' + ((t && t.src) || e.filename || ''));
  }, true);
  window.addEventListener('unhandledrejection', function (e) { show('ERROR: ' + ((e.reason && (e.reason.message || e.reason)) || 'unknown')); });
  setTimeout(function () {
    if (document.querySelector('.hero')) return;
    var files = ['app.js', 'data.js', 'firebase.js', 'i18n.js', 'util.js', 'admin.js', 'style.css', 'logo.png', 'favicon.png', 'manifest.webmanifest'];
    Promise.all(files.map(function (f) {
      return fetch(f, { cache: 'no-store' }).then(function (r) { return r.ok ? null : f + '  ->  NOT FOUND (' + r.status + ')'; }).catch(function () { return f + '  ->  network error'; });
    })).then(function (res) {
      res = res.filter(Boolean);
      show(res.length ? 'MISSING FILES:\n' + res.join('\n') : 'All files are present. The page did not start: probably the Firebase library is blocked (VPN / ad-blocker / no internet). Send a screenshot of this box.');
    });
  }, 6000);
})();
</script>
<script type="module" src="app.js"></script>
</body>
