<!doctype html><html lang=ar><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>رحلة نيو</title>
<style>html,body{margin:0;height:100%;background:#0d0d1a;overflow:hidden;touch-action:none;user-select:none;font-family:system-ui}
#c{position:absolute;inset:0;margin:auto;width:min(100vw,177.7vh);aspect-ratio:16/9}
.b{position:fixed;bottom:16px;width:64px;height:64px;border-radius:50%;border:0;background:#ffffff55;color:#fff;font-size:26px}
#p{position:fixed;top:8px;right:8px;display:flex;gap:6px}#p button{border:0;border-radius:10px;padding:6px 10px;background:#ffffff40;color:#fff;font-size:16px}
@media(hover:hover){.b{display:none}}</style>
<canvas id=c width=640 height=360></canvas>
<div id=p><button onclick="pz=!pz">⏸</button><button onclick="mu=!mu;this.textContent=mu?'🔇':'🔊'">🔊</button></div>
<button class=b data-k=ArrowLeft style="left:14px">◀</button><button class=b data-k=ArrowRight style="left:88px">▶</button><button class=b data-k=Space style="right:14px;width:80px;height:80px">⤒</button>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),K={};let pz=0,mu=0,AC,L=1,m,W,en,co,F,P,ck,cam=0,sc=0,lv=3,st='menu',tk=0;
function go(){if(pz){pz=0;return}if(st=='play'||Date.now()-tk<400)return;tk=Date.now();L=1;sc=0;lv=3;load(1);st='play'}
onkeydown=e=>{K[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code=='KeyP')pz=!pz;else go()};onkeyup=e=>K[e.code]=0;
document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=()=>{K[b.dataset.k]=1;go()};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>K[b.dataset.k]=0});c.onpointerdown=go;
function snd(f,d=.1,t='square'){if(mu)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),v=AC.createGain();o.type=t;o.frequency.value=f;v.gain.value=.04;o.connect(v);v.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch{}}
const done=()=>parent.postMessage({cg:1,game:'plat',score:sc},'*');
const rnd=s=>()=>(s=s*16807%2147483647)/2147483647;
function load(n){const r=rnd(n*97+13);W=60+n*20;m=[...Array(9)].map(()=>Array(W).fill(0));en=[];co=[];let safe=9,gap=0;
for(let x=0;x<W;x++){if(!gap&&x>=safe&&x<W-8&&r()<.1+.03*n){gap=2+(r()<.4?1:0);safe=x+gap+5}
if(gap){gap--;continue}m[8][x]=1;
if(x>6&&x<W-8&&x%9==4&&r()<.75){const l=3+(r()*2|0),row=5+(r()*2|0);for(let i=0;i<l;i++){m[row][x+i]=1;co.push({x:(x+i)*40+20,y:(row-1)*40+20})}}
else if(x>5&&r()<.15)co.push({x:x*40+20,y:290});
if(x>12&&x<W-8&&r()<.035+.015*n&&!m[5][x]&&!m[6][x])en.push({x:x*40,y:292,w:30,h:28,vx:r()<.5?1:-1,vy:0})}
F=(W-4)*40;P={x:60,y:200,w:26,h:34,vx:0,vy:0,on:0,f:1,inv:0};ck={x:60,y:200};cam=0}
const sol=(x,y)=>{const tx=Math.floor(x/40),ty=Math.floor(y/40);if(tx<0||tx>=W)return 1;return ty>=0&&ty<9&&m[ty][tx]};
const hit=o=>sol(o.x,o.y)||sol(o.x+o.w,o.y)||sol(o.x,o.y+o.h)||sol(o.x+o.w,o.y+o.h)||sol(o.x,o.y+o.h/2)||sol(o.x+o.w,o.y+o.h/2);
function mvx(o){o.x+=o.vx;if(hit(o)){o.x=o.vx>0?Math.floor((o.x+o.w)/40)*40-o.w-.01:(Math.floor(o.x/40)+1)*40+.01;o.vx=0}}
function mvy(o){o.y+=o.vy;o.on=0;if(hit(o)){if(o.vy>0){o.y=Math.floor((o.y+o.h)/40)*40-o.h-.01;o.on=1}else o.y=(Math.floor(o.y/40)+1)*40+.01;o.vy=0}}
function hurt(){snd(140,.3,'sawtooth');if(--lv<=0){st='over';done();return}Object.assign(P,{x:ck.x,y:ck.y,vx:0,vy:0,inv:90})}
function up(){if(st!='play'||pz)return;const l=K.ArrowLeft||K.KeyA,r=K.ArrowRight||K.KeyD,j=K.Space||K.ArrowUp||K.KeyW;
P.vx=(r?3.4:0)-(l?3.4:0);if(P.vx)P.f=P.vx>0?1:-1;if(P.inv)P.inv--;
if(j&&P.on){P.vy=-12.5;snd(520,.12)}P.vy=Math.min(P.vy+.55,14);mvx(P);mvy(P);
if(P.y>420){hurt();return}
if(P.on&&P.x>ck.x+600&&sol(P.x,P.y+P.h+2)&&sol(P.x+P.w,P.y+P.h+2))ck={x:P.x,y:P.y};
co=co.filter(k=>{if(Math.hypot(k.x-P.x-13,k.y-P.y-17)<26){sc+=10;snd(900,.08,'sine');return 0}return 1});
for(const e of en){if(e.d)continue;e.x+=e.vx;if(hit(e)||!sol(e.x+(e.vx>0?e.w+2:-2),e.y+e.h+4)){e.x-=e.vx;e.vx*=-1}
if(P.x<e.x+e.w&&P.x+P.w>e.x&&P.y<e.y+e.h&&P.y+P.h>e.y){if(P.vy>0&&P.y+P.h-e.y<22){e.d=1;P.vy=-8;sc+=50;snd(700,.1)}else if(!P.inv){hurt();return}}}
if(P.x>F){sc+=100;snd(1200,.3,'sine');if(L<3)load(++L);else{st='win';done();return}}
cam=Math.max(0,Math.min(P.x-250,W*40-640))}
function dr(){let s=g.createLinearGradient(0,0,0,360);s.addColorStop(0,'#5aa9ff');s.addColorStop(1,'#cfe9ff');g.fillStyle=s;g.fillRect(0,0,640,360);
g.fillStyle='#ffffff90';for(let i=0;i<8;i++){const x=((i*230-cam*.3)%1000+1000)%1000-150;g.beginPath();g.arc(x,60+i%3*30,26,0,7);g.arc(x+28,66+i%3*30,20,0,7);g.fill()}
g.fillStyle='#7ccf8a66';for(let i=0;i<6;i++){const x=((i*260-cam*.5)%1300+1300)%1300-200;g.beginPath();g.arc(x,340,120,Math.PI,0);g.fill()}
g.save();g.translate(-(cam|0),0);
for(let y=0;y<9;y++)for(let x=Math.max(0,cam/40|0);x<Math.min(W,(cam+640)/40+1);x++)if(m[y][x]){g.fillStyle='#8a5a2b';g.fillRect(x*40,y*40,40,40);g.fillStyle='#43b95a';g.fillRect(x*40,y*40,40,8);g.fillStyle='#0002';g.fillRect(x*40+38,y*40,2,40)}
co.forEach(k=>{g.fillStyle='#ffd23f';g.beginPath();g.ellipse(k.x,k.y+Math.sin(Date.now()/200+k.x)*3,8,10,0,0,7);g.fill()});
en.forEach(e=>{if(e.d)return;g.fillStyle='#e0434f';g.beginPath();g.roundRect(e.x,e.y,e.w,e.h,10);g.fill();g.fillStyle='#fff';g.fillRect(e.x+6,e.y+7,6,6);g.fillRect(e.x+18,e.y+7,6,6);g.fillStyle='#000';g.fillRect(e.x+8,e.y+9,3,3);g.fillRect(e.x+20,e.y+9,3,3)});
g.fillStyle='#fff';g.fillRect(F,160,5,160);g.fillStyle='#ff3b5c';g.beginPath();g.moveTo(F+5,160);g.lineTo(F+45,180);g.lineTo(F+5,200);g.fill();
if(!(P.inv&&Date.now()/80%2<1)){g.fillStyle='#6d4aff';g.beginPath();g.roundRect(P.x,P.y,P.w,P.h,9);g.fill();g.fillStyle='#2f6bff';g.fillRect(P.x,P.y+P.h-9,P.w,9);g.fillStyle='#fff';g.fillRect(P.x+(P.f>0?13:3),P.y+8,9,9);g.fillStyle='#000';g.fillRect(P.x+(P.f>0?17:5),P.y+11,4,4)}
g.restore();g.fillStyle='#fff';g.font='bold 18px system-ui';g.textAlign='left';g.fillText('❤'.repeat(Math.max(lv,0))+'  ⭐'+sc+'  LEVEL '+L+'/3',12,26);
if(st!='play'||pz){g.fillStyle='#000a';g.fillRect(0,0,640,360);g.fillStyle='#fff';g.textAlign='center';g.font='bold 34px system-ui';g.fillText(pz?'متوقفة مؤقتًا':st=='menu'?'رحلة نيو':st=='over'?'خسرت!':'🎉 أنهيت المغامرة!',320,150);g.font='17px system-ui';g.fillText(pz?'اضغط للمتابعة':st=='menu'?'← → حركة · مسافة قفز · اقفز على الأعداء · اضغط للبدء':'النقاط: '+sc+' · اضغط للعب مجددًا',320,195)}}
load(1);(function f(){up();dr();requestAnimationFrame(f)})();
</script></html>
